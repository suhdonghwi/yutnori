name: Deploy to Devbox

on:
  push:
    branches: [main]
    paths:
      - app/**
      - public/**
      - src/**
      - deploy/**
      - .dockerignore
      - Dockerfile
      - docker-compose.yml
      - index.html
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - vite.config.ts
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the published image to production
        required: true
        type: boolean
        default: true

concurrency:
  group: yutnori-production
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.metadata.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - id: metadata
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$owner/yutnori:$SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      packages: read
    steps:
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.VPS_HOST }}

      - name: Deploy immutable image
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.repository_owner }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          YUTNORI_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          printf '%s' "$GHCR_TOKEN" | ssh -T \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            "$target" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -T \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            "$target" \
            "DEPLOY_SHA='$DEPLOY_SHA' YUTNORI_IMAGE='$YUTNORI_IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$HOME/projects/yutnori"
          test -z "$(git status --porcelain)"
          git fetch origin main
          git checkout --detach "$DEPLOY_SHA"
          YUTNORI_IMAGE="$YUTNORI_IMAGE" docker compose config --quiet
          YUTNORI_IMAGE="$YUTNORI_IMAGE" docker compose pull
          YUTNORI_IMAGE="$YUTNORI_IMAGE" docker compose up -d --wait --remove-orphans
          REMOTE

      - name: Verify container health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          YUTNORI_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          ssh -T \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            "$target" \
            "cd \"\$HOME/projects/yutnori\" && YUTNORI_IMAGE='$YUTNORI_IMAGE' docker compose ps"

      - name: Logout from GHCR on Devbox
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
        run: |
          target="$VPS_USER@$VPS_HOST"
          ssh -T \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            "$target" \
            "docker logout ghcr.io || true" || true
