name: yutnori

services:
  web:
    image: ${YUTNORI_IMAGE:?YUTNORI_IMAGE is required}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      yutnori_edge:
        aliases:
          - yutnori-web

  edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Edge.Caddyfile:/etc/caddy/Caddyfile:ro
      - edge_data:/data
      - edge_config:/config
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - yutnori_edge

networks:
  yutnori_edge:
    name: yutnori_edge

volumes:
  edge_data:
    name: yutnori_edge_data
  edge_config:
    name: yutnori_edge_config
